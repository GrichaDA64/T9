<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minuteur réglable</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <button id="timerButton">30</button>

    <div class="controls">
      <button id="chillButton">Chill</button>
      <button id="panicButton">Panic</button>
      <button id="stopButton">⏹️</button>
    </div>
  </div>

  <div class="bottom-bar">
    <label for="durationInput">Durée (s) :</label>
    <input type="number" id="durationInput" min="1" value="30">

    <!-- box invisible pour pousser le champ vers le haut -->
    <div class="spacer"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
