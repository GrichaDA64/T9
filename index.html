<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minuteur réglable</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Barre du haut ===== -->
<div class="top-bar">
  <div class="top-bar-inner">
    <button id="chillButton">Chill</button>
    <button id="panicButton">Panic</button>
  </div>
</div>

  <!-- ===== Zone centrale ===== -->
  <div class="container">
    <button id="timerButton">30</button>

    <button id="stopButton">Stop</button>
  </div>

  <!-- ===== Barre du bas ===== -->
  <div class="bottom-bar">
    <label for="durationInput">Durée (s) :</label>

    <input
      type="number"
      id="durationInput"
      min="1"
      value="30"
    >
  </div>

  <script src="script.js"></script>

</body>
</html>
